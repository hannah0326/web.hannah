<!DOCTYPE html>
<html>

<head>
  <title>Flexbox예제변형연습</title>

  <style>
  /* CSS: 부모에게 flex 지시 */
    .container { 
      display: flex;
      justify-content: center;
      gap: 12px;
      color: #ffffff;
      font-size: 15px;
    }

    .box {
      padding: 15px;
      border-radius: 9px;
    }

    #box1 {
      background: #1a91a9;
    }

    #box2 {
      background: #165168;
    }

    #box3 {
      background: #083642;
    }
  </style>
</head>

<body>
  <!-- HTML: 박스 3개를 감싸는 부모 -->
  <div class="container">
    <div class="box" id="box1">박스1</div>
    <div class="box" id="box2">박스2</div>
    <div class="box" id="box3">박스3</div>
  </div>
</body>

</html>
